spring.application.name=tarea2

# Puerto de la API (variable de entorno APP_PORT, por defecto 3001)
server.port=${APP_PORT:3001}

# Ruta del archivo de compras (variable de entorno CSV_PATH, por defecto compras.csv en la raíz)
app.csv-path=${CSV_PATH:compras.csv}

# API pública de indicadores económicos
mindicador.url=https://mindicador.cl/api