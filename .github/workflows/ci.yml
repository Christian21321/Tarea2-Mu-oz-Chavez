name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop, Develop]

env:
  IMAGE_NAME: tarea2

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ejecutar tests
        run: mvn -B test

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generar JAR
        run: mvn -B package -DskipTests

      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar

      - name: Construir imagen Docker
        run: docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t $IMAGE_NAME:${{ github.sha }} .

      - name: Exportar imagen para el job publish
        run: docker save $IMAGE_NAME:${{ github.sha }} -o imagen.tar

      - name: Guardar imagen
        uses: actions/upload-artifact@v4
        with:
          name: imagen-docker
          path: imagen.tar
          retention-days: 1

  publish:
    name: publish
    needs: build
    # Solo cuando se hace push a main (por ejemplo, al integrar develop en main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar imagen
        uses: actions/download-artifact@v4
        with:
          name: imagen-docker

      - name: Cargar imagen
        run: docker load -i imagen.tar

      # Credenciales: GITHUB_TOKEN lo entrega GitHub en cada ejecución, no hay contraseñas en el repositorio
      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetar y publicar (latest y SHA corto)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGEN=ghcr.io/$OWNER/$REPO
          SHA_CORTO=$(echo "${{ github.sha }}" | cut -c1-7)
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGEN:latest
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGEN:$SHA_CORTO
          docker push $IMAGEN:latest
          docker push $IMAGEN:$SHA_CORTO
          echo "Imagen publicada: $IMAGEN:latest y $IMAGEN:$SHA_CORTO" >> $GITHUB_STEP_SUMMARY
