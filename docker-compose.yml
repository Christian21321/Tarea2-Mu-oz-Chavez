services:
  app:
    build: .
    image: tarea2:latest
    container_name: tarea2
    environment:
      APP_PORT: ${APP_PORT:-3001}
      CSV_PATH: /data/compras.csv
    ports:
      - "${APP_PORT:-3001}:${APP_PORT:-3001}"
    volumes:
      # El CSV se monta desde la raíz del repositorio; se puede editar sin reconstruir la imagen
      - ./compras.csv:/data/compras.csv:ro
    restart: unless-stopped
